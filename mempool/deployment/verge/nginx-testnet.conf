# Include in nginx's http context on the testnet host. Terminate public TLS in
# a separate virtual host after the local gateway passes check-live.cjs.
map $http_upgrade $verge_testnet_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /opt/verge-explorer-testnet/current/frontend;
    index index.html;
    client_max_body_size 1m;
    error_page 503 /maintenance.html;

    location = /api/v1/internal { return 404; }
    location ^~ /api/v1/internal/ { return 404; }
    location ^~ /api/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $verge_testnet_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location ^~ /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /resources/config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /index.html {
        if (!-f /run/verge-explorer-testnet-site-gate/ready) { return 503; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /maintenance.html {
        alias /opt/verge-explorer-testnet/current/deployment/maintenance.html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
    }
    location = /source/sources.tar.gz { alias /opt/verge-explorer-testnet/current/sources.tar.gz; }
    location = /source/BUILD.json { alias /opt/verge-explorer-testnet/current/BUILD.json; }
    location /source/ { return 404; }
    location ~* \.(?:js|css|png|svg|ico|woff2?|ttf|webmanifest|txt)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        if (!-f /run/verge-explorer-testnet-site-gate/ready) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}

# Include in nginx's http context. This loopback gateway is for staging or a
# separate TLS virtual host; configure the actual domain/certificate before launch.
map $http_upgrade $verge_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /opt/verge-explorer/current/frontend;
    index index.html;
    client_max_body_size 1m;

    location ^~ /api/v1/internal/ { return 404; }
    location ^~ /api/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $verge_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location ^~ /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /resources/config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Publish only the corresponding source archive and build manifest.
    location = /source/sources.tar.gz { alias /opt/verge-explorer/current/sources.tar.gz; }
    location = /source/BUILD.json { alias /opt/verge-explorer/current/BUILD.json; }
    location /source/ { return 404; }
    location ~* \.(?:js|css|png|svg|ico|woff2?|ttf|webmanifest|txt)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}

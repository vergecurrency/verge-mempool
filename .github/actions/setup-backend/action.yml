name: Set up Mempool backend
description: Build the locked Linux native addon and install backend dependencies; run ci-rust-setup for mempool/rust/gbt first.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.13.0
        cache: npm
        cache-dependency-path: mempool/backend/package-lock.json
    - name: Use pinned npm
      run: npm install --global npm@11.12.0 --no-audit --no-fund
      shell: bash
    - name: Build the native addon
      shell: bash
      working-directory: mempool/rust/gbt
      run: |-
        cargo build --locked --release
        mkdir -p ../../backend/rust-gbt
        cp package.json ../../backend/rust-gbt/
        cp ../../deployment/verge/native-addon.cjs ../../backend/rust-gbt/index.js
        cp ../../deployment/verge/native-addon.d.ts ../../backend/rust-gbt/index.d.ts
        cp target/release/libgbt.so ../../backend/rust-gbt/gbt.linux-x64-gnu.node
    - name: Audit backend install scripts
      shell: bash
      working-directory: mempool
      run: bash backend/meta/scripts/check-install-scripts.sh
    - name: Install locked backend dependencies
      shell: bash
      working-directory: mempool/backend
      run: |-
        npm ci --ignore-scripts --no-audit --no-fund
        node -e 'if(typeof require("rust-gbt").GbtGenerator!=="function")process.exit(1);process.exit(0)'

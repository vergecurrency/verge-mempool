name: Container manifest information (manual)
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full public image reference, including registry, repository and tag or digest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Inspect selected image
        env:
          IMAGE: ${{ inputs.image }}
        run: |-
          [[ "$IMAGE" != -* ]]
          docker buildx imagetools inspect "$IMAGE"
